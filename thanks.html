<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Teşekkürler</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      background:
        radial-gradient(1200px 700px at 80% -10%, rgba(6,182,212,.45), transparent 60%),
        linear-gradient(160deg, #0a1921 0%, #0b1f25 100%);
      color: #e6f3f6;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      text-align: center;
    }
    .box {
      background: #10262c;
      border: 1px solid #1b3a42;
      border-radius: 14px;
      padding: 40px 32px;
      max-width: 420px;
      box-shadow: 0 10px 30px rgba(0,0,0,.25);
    }
    h1 { color: #06B6D4; margin-bottom: 12px; }
    p { color: #a7c6cf; }
    a {
      display: inline-block;
      margin-top: 20px;
      text-decoration: none;
      color: #06B6D4;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>Kayıt Olduğunuz İçin Teşekkürler!</h1>
    <p>Formunuz başarıyla gönderildi.</p>
    <a href="index.html">← Ana Sayfaya Dön</a>
  </div>
</body>
</html>
